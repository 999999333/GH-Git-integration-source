name: Create Fabric Workspace
on:
  workflow_dispatch:

env:
  WORKSPACE_NAME: WS-fabricUser-03-test

jobs:
  create_workspace:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Fabric CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install fabric-cli

      - name: Verify Fabric CLI
        run: |
          python -m fab --version
      
      - name: Fabric CLI Login with Service Principal
        run: |
          python -m fab auth login --u '${{ secrets.FABRIC_CLIENT_ID }}' \
                                  --p '${{ secrets.FABRIC_CLIENT_SECRET }}' \
                                  --tenant '${{ secrets.FABRIC_TENANT_ID }}'
      
      - name: Create Fabric Workspace
        run: |
          if python -m fab workspace get "$WORKSPACE_NAME" > /dev/null 2>&1; then
            echo "Workspace already exists: $WORKSPACE_NAME"
          else
            python -m fab workspace create "$WORKSPACE_NAME"
          fi
      
      - name: Set Workspace Permissions
        run: |
          python -m fab acl set "$WORKSPACE_NAME.Workspace" -I '${{ secrets.FABRIC_PRINCIPAL_OBJECT_ID }}' -R contributor
      
      - name: Verify Workspace Creation
        run: |
          python -m fab workspace get "$WORKSPACE_NAME"